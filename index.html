<body>
<header class="site-header">
    <h1>Афіша подій міста</h1>
    <nav>
        <a href="#events">Події</a>
        <a href="#current">Обрана подія</a>
    </nav>
</header>

<div class="layout">
    <main>
        <section id="filters">
            <h2>Фільтр за датою/категорією</h2>
            <form class="filters">
                <div class="filter-date">
                    <label for="event-date">Оберіть дату події:</label>
                    <input type="date" id="event-date">
                </div>

                <div class="filter-category">
                    <label for="event-category">Оберіть категорію події:</label>
                    <select id="event-category">
                        <option value="music">Музика</option>
                        <option value="art">Мистецтво</option>
                        <option value="theatre">Театр</option>
                        <option value="holiday">Свята</option>
                    </select>
                </div>
            </form>
        </section>

        <section id="forms">
            <h2>Додати нову подію</h2>
            <form class="add-event-form">
                <div class="add-event">
                    <label for="event-name">Уведіть назву події</label>
                    <input type="text" id="event-name" name="title" required pattern=".{3,}">

                    <label for="new-event-category">Оберіть категорію події:</label>
                    <select id="new-event-category" name="category" required>
                        <option value="Музика">Музика</option>
                        <option value="Мистецтво">Мистецтво</option>
                        <option value="Театр">Театр</option>
                        <option value="holiday">Свята</option>
                    </select>

                    <label for="new-event-date">Оберіть дату події</label>
                    <input type="date" id="new-event-date" name="date" required>
                </div>

                <div class="form-submit">
                    <button type="submit" class="btn">Додати подію</button>
                </div>
            </form>
        </section>

        <section id="quick-filters">
            <h2>Швидкі фільтри</h2>
            <div class="buttons-container" id="category-filters">
                <button type="button" class="btn" data-category="all">Усі</button>
                <button type="button" class="btn" data-category="Музика">Музика</button>
                <button type="button" class="btn" data-category="Мистецтво">Мистецтво</button>
                <button type="button" class="btn" data-category="Театр">Театр</button>
                <button type="button" class="btn" data-category="Свята">Свята</button>
            </div>
        </section>
